---
- name: Create container instances
  hosts: localhost
  gather_facts: false
  pre_tasks:
    - name: Load the Molecule host group's image settings for the controller
      ansible.builtin.include_vars:
        file: "{{ molecule_scenario_directory }}/../inventory/group_vars/molecule.yml"
  tasks:
    - name: Create a temporary Podman build context
      ansible.builtin.tempfile:
        state: directory
        suffix: molecule-image
      register: molecule_build_context

    - name: Render the Dockerfile for the selected base image
      ansible.builtin.template:
        src: "{{ molecule_scenario_directory }}/../image/Dockerfile.j2"
        dest: "{{ molecule_build_context.path }}/Dockerfile"
        mode: '0644'

    - name: Build the test image
      containers.podman.podman_image:
        name: "{{ molecule_image_name }}"
        tag: "{{ molecule_image_tag }}"
        path: "{{ molecule_build_context.path }}"
        force: true

    - name: Create containers from inventory
      containers.podman.podman_container:
        hostname: "{{ item }}"
        name: "{{ item }}"
        image: "{{ hostvars[item]['container_image'] }}"
        command: "{{ hostvars[item]['container_command'] | default('sleep 1d') }}"
        privileged: "{{ hostvars[item]['container_privileged'] | default(false) }}"
        volumes: "{{ hostvars[item]['container_volumes'] | default(omit) }}"
        capabilities: "{{ hostvars[item]['container_capabilities'] | default(omit) }}"
        systemd: "{{ hostvars[item]['container_systemd'] | default(false) }}"
        log_driver: "{{ hostvars[item]['container_log_driver'] | default('json-file') }}"
        state: started
      register: result
      loop: "{{ groups['molecule'] }}"

    - name: Verify containers are running
      ansible.builtin.include_tasks:
        file: tasks/create-fail.yml
      when: >
        item.container.State.ExitCode != 0 or
        not item.container.State.Running
      loop: "{{ result.results }}"
      loop_control:
        label: "{{ item.container.Name }}"
