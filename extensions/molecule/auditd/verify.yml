---
- name: Verify Auditd
  hosts: molecule
  become: true
  gather_facts: true
  vars:
    auditd_package_name: auditd
    auditd_service_name: auditd

  tasks:
    - name: Collect installed package facts
      ansible.builtin.package_facts:
        manager: auto

    - name: Collect service facts
      ansible.builtin.service_facts:

    - name: Assert that auditd is installed and enabled
      ansible.builtin.assert:
        that:
          - auditd_package_name in ansible_facts.packages
          - auditd_service_name in ansible_facts.services
        fail_msg: >-
          Expected {{ auditd_package_name }} to be installed and
          {{ auditd_service_name }} to be enabled.
