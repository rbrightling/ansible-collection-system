---
name: "rbrightling.system.auditd"

on:
  pull_request:
    paths:
      - 'roles/auditd/**'
      - 'extensions/molecule/auditd/**'
      - '.github/workflows/auditd.yml'
      - 'tox.ini'
  push:
    branches:
      - main
    paths:
      - 'roles/auditd/**'
      - 'extensions/molecule/auditd/**'
      - '.github/workflows/auditd.yml'
      - 'tox.ini'

jobs:
  call_reuseable_workflow:
    uses: ./.github/workflows/reusable-ansible-test-role.yml
    with:
      role-name: 'auditd'
