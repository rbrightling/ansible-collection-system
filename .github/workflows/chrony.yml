---
name: "rbrightling.system.chrony"

on:
  pull_request:
    paths:
      - 'roles/chrony/**'
      - 'extensions/molecule/chrony/**'
      - '.github/workflows/chrony.yml'
      - 'tox.ini'
  push:
    branches:
      - main
    paths:
      - 'roles/chrony/**'
      - 'extensions/molecule/chrony/**'
      - '.github/workflows/chrony.yml'
      - 'tox.ini'

jobs:
  call_reusable_workflow:
    uses: ./.github/workflows/reusable-ansible-test-role.yml
    with:
      role-name: 'chrony'
