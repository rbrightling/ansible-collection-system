---
name: "rbrightling.system.fail2ban"

on:
  pull_request:
    paths:
      - 'roles/fail2ban/**'
      - 'extensions/molecule/fail2ban/**'
      - '.github/workflows/fail2ban.yml'
      - 'tox.ini'
  push:
    branches:
      - main
    paths:
      - 'roles/fail2ban/**'
      - 'extensions/molecule/fail2ban/**'
      - '.github/workflows/fail2ban.yml'
      - 'tox.ini'

jobs:
  call_reusable_workflow:
    uses: ./.github/workflows/reusable-ansible-test-role.yml
    with:
      role-name: 'fail2ban'
