---
name: "rbrightling.system.cron"

on:
  pull_request:
    paths:
      - 'roles/cron/**'
      - 'extensions/molecule/cron/**'
      - '.github/workflows/cron.yml'
      - 'tox.ini'
  push:
    branches:
      - main
    paths:
      - 'roles/cron/**'
      - 'extensions/molecule/cron/**'
      - '.github/workflows/cron.yml'
      - 'tox.ini'

jobs:
  call_reusable_workflow:
    uses: ./.github/workflows/reusable-ansible-test-role.yml
    with:
      role-name: 'cron'
