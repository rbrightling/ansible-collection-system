---
name: "rbrightling.system.pam"

on:
  pull_request:
    paths:
      - 'roles/pam/**'
      - 'extensions/molecule/pam/**'
      - '.github/workflows/pam.yml'
      - 'tox.ini'
  push:
    branches:
      - main
    paths:
      - 'roles/pam/**'
      - 'extensions/molecule/pam/**'
      - '.github/workflows/pam.yml'
      - 'tox.ini'

jobs:
  call_reusable_workflow:
    uses: ./.github/workflows/reusable-ansible-test-role.yml
    with:
      role-name: 'pam'
