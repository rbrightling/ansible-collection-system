---
name: "rbrightling.system.sudo"

on:
  pull_request:
    paths:
      - 'roles/sudo/**'
      - 'extensions/molecule/sudo/**'
      - '.github/workflows/sudo.yml'
      - 'tox.ini'
  push:
    branches:
      - main
    paths:
      - 'roles/sudo/**'
      - 'extensions/molecule/sudo/**'
      - '.github/workflows/sudo.yml'
      - 'tox.ini'

jobs:
  call_reusable_workflow:
    uses: ./.github/workflows/reusable-ansible-test-role.yml
    with:
      role-name: 'sudo'
