---
name: "rbrightling.system.logrotate"

on:
  pull_request:
    paths:
      - 'roles/logrotate/**'
      - 'extensions/molecule/logrotate/**'
      - '.github/workflows/logrotate.yml'
      - 'tox.ini'
  push:
    branches:
      - main
    paths:
      - 'roles/logrotate/**'
      - 'extensions/molecule/logrotate/**'
      - '.github/workflows/logrotate.yml'
      - 'tox.ini'

jobs:
  call_reusable_workflow:
    uses: ./.github/workflows/reusable-ansible-test-role.yml
    with:
      role-name: 'logrotate'
