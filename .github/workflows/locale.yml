---
name: "rbrightling.system.locale"

on:
  pull_request:
    paths:
      - 'roles/locale/**'
      - 'extensions/molecule/locale/**'
      - '.github/workflows/locale.yml'
      - 'tox.ini'
  push:
    branches:
      - main
    paths:
      - 'roles/locale/**'
      - 'extensions/molecule/locale/**'
      - '.github/workflows/locale.yml'
      - 'tox.ini'

jobs:
  call_reusable_workflow:
    uses: ./.github/workflows/reusable-ansible-test-role.yml
    with:
      role-name: 'locale'
