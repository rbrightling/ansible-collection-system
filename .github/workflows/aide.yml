---
name: "rbrightling.system.aide"

on:
  pull_request:
    paths:
      - 'roles/aide/**'
      - 'extension/molecule/aide/**'
      - '.github/workflows/aide.yml'
      - 'tox.ini'
  push:
    branches:
      - main
    paths:
      - 'roles/aide/**'
      - 'extension/molecule/aide/**'
      - '.github/workflows/aide.yml'
      - 'tox.ini'

jobs:
  call_reusable_workflow:
    uses: ./.github/workflows/reusable-ansible-test-role.yml
    with:
      role-name: 'aide'
