---
name: "rbrightling.system.sysstat"

on:
  pull_request:
    paths:
      - 'roles/sysstat/**'
      - 'extensions/molecule/sysstat/**'
      - '.github/workflows/sysstat.yml'
      - 'tox.ini'
  push:
    branches:
      - main
    paths:
      - 'roles/sysstat/**'
      - 'extensions/molecule/sysstat/**'
      - '.github/workflows/sysstat.yml'
      - 'tox.ini'

jobs:
  call_reusable_workflow:
    uses: ./.github/workflows/reusable-ansible-test-role.yml
    with:
      role-name: 'sysstat'
