---
name: "rbrightling.system.hosts"

on:
  pull_request:
    paths:
      - 'roles/hosts/**'
      - 'extensions/molecule/hosts/**'
      - '.github/workflows/hosts.yml'
      - 'tox.ini'
  push:
    branches:
      - main
    paths:
      - 'roles/hosts/**'
      - 'extensions/molecule/hosts/**'
      - '.github/workflows/hosts.yml'
      - 'tox.ini'

jobs:
  call_reusable_workflow:
    uses: ./.github/workflows/reusable-ansible-test-role.yml
    with:
      role-name: 'hosts'
