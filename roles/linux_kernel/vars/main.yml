---
# vars file for linux_kernel

linux_kernel__sysctl_items:
  - name: net.ipv4.conf.all.send_redirects
    value: "{{ linux_kernel_net_ipv4_conf_all_send_redirects }}"
  - name: "net.ipv4.conf.default.send_redirects"
    value: "{{ linux_kernel_net_ipv4_conf_default_send_redirects }}"
  - name: net.ipv4.ip_forward
    value: "{{ linux_kernel_net_ipv4_ip_forward }}"
  - name: net.ipv6.conf.all.forwarding
    value: "{{ linux_kernel_net_ipv6_conf_all_forwarding }}"
  - name: net.ipv4.conf.all.accept_source_route
    value: "{{ linux_kernel_net_ipv4_conf_all_accept_source_route }}"
  - name: net.ipv4.conf.default.accept_source_route
    value: "{{ linux_kernel_net_ipv4_conf_default_accept_source_route }}"
  - name: net.ipv6.conf.all.accept_source_route
    value: "{{ linux_kernel_net_ipv6_conf_all_accept_source_route }}"
  - name: net.ipv6.conf.default.accept_source_route
    value: "{{ linux_kernel_net_ipv6_conf_default_accept_source_route }}"
  - name: net.ipv4.conf.all.accept_redirects
    value: "{{ linux_kernel_net_ipv4_conf_all_accept_redirects }}"
  - name: net.ipv4.conf.default.accept_redirects
    value: "{{ linux_kernel_net_ipv4_conf_default_accept_redirects }}"
  - name: net.ipv6.conf.all.accept_redirects
    value: "{{ linux_kernel_net_ipv6_conf_all_accept_redirects }}"
  - name: net.ipv6.conf.default.accept_redirects
    value: "{{ linux_kernel_net_ipv6_conf_default_accept_redirects }}"
  - name: net.ipv4.conf.all.secure_redirects
    value: "{{ linux_kernel_net_ipv4_conf_all_secure_redirects }}"
  - name: net.ipv4.conf.default.secure_redirects
    value: "{{ linux_kernel_net_ipv4_conf_default_secure_redirects }}"
  - name: net.ipv4.conf.all.log_martians
    value: "{{ linux_kernel_net_ipv4_conf_all_log_martians }}"
  - name: net.ipv4.conf.default.log_martians
    value: "{{ linux_kernel_net_ipv4_conf_default_log_martians }}"
  - name: net.ipv4.icmp_echo_ignore_broadcasts
    value: "{{ linux_kernel_net_ipv4_icmp_echo_ignore_broadcasts }}"
  - name: net.ipv4.icmp_ignore_bogus_error_responses
    value: "{{ linux_kernel_net_ipv4_icmp_ignore_bogus_error_responses }}"
  - name: net.ipv4.conf.all.rp_filter
    value: "{{ linux_kernel_net_ipv4_conf_all_rp_filter }}"
  - name: net.ipv4.conf.default.rp_filter
    value: "{{ linux_kernel_net_ipv4_conf_default_rp_filter }}"
  - name: net.ipv4.tcp_syncookies
    value: "{{ linux_kernel_net_ipv4_tcp_syncookies }}"
  - name: net.ipv6.conf.all.accept_ra
    value: "{{ linux_kernel_net_ipv6_conf_all_accept_ra }}"
  - name: net.ipv6.conf.default.accept_ra
    value: "{{ linux_kernel_net_ipv6_conf_default_accept_ra }}"
  - name: kernel.randomize_va_space
    value: "{{ linux_kernel_randomize_va_space }}"
  - name: fs.suid_dumpable
    value: "{{ linux_kernel_fs_suid_dumpable }}"

linux_kernel__blacklist_modules:
  - type: filesystem
    modules:
      freevxfs: "{{ linux_kernel_disable_module_freevxfs }}"
      jffs2:  "{{ linux_kernel_disable_module_jffs2 }}"
      hfs: "{{ linux_kernel_disable_module_hfs }}"
      hfsplus: "{{ linux_kernel_disable_module_hfsplus }}"
      squashfs: "{{ linux_kernel_disable_module_squashfs }}"
      udf: "{{ linux_kernel_disable_module_udf }}"
      usb-storage: "{{ linux_kernel_disable_module_usb_storage }}"
  - type: network
    modules:
      rds: "{{ linux_kernel_disable_module_rds }}"
      tipc: "{{ linux_kernel_disable_module_tipc }}"
