---
- name: Template pwquality configure
  ansible.builtin.template:
    src: "pwquality.conf.j2"
    dest: /etc/security/pwquality.conf
    owner: root
    group: root
    mode: "0644"
  become: true


- name: Template pwhistory configure
  ansible.builtin.template:
    src: "pwhistory.conf.j2"
    dest: /etc/security/pwhistory.conf
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Configure password pam_unix
  community.general.pamd:
    name: common-password
    type: password
    control: "[success=1 default=ignore]"
    module_path: pam_unix.so
    module_arguments:
      - "rounds={{ pam_password_rounds }}"
    state: args_present
  become: true

- name: Configure password history
  community.general.pamd:
    name: common-password
    type: password
    control: "[success=1 default=ignore]"
    module_path: pam_unix.so
    new_type: password
    new_control: requisite
    new_module_path: pam_pwhistory.so
    state: before
  become: true

- name: Permissions for opasswd
  ansible.builtin.file:
    path: /etc/security/opasswd
    owner: root
    group: root
    mode: '0600'
  become: true
