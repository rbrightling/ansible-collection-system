[tox]
minversion = 3.7.0
envlist = 
  ansible221-aide-debian13
  ansible221-ansible_account-debian13
  ansible221-ansible_node-debian12
  ansible221-cron-debian13
  ansible221-fail2ban-debian13
  ansible221-hosts-debian13
  ansible221-locale-debian13
  ansible221-openssh_server-debian13
  ansible221-shadow_utils-debian13
  ansible221-sudo-debian13
  ansible221-sysstat-debian13
  ansible221-auditd-ddebian13
skipsdist = true

[testenv]
passenv = *
setenv = 
  debian12: MOLECULE_IMAGE=docker.io/library/debian:12
  debian13: MOLECULE_IMAGE=docker.io/library/debian:13
  aide: ROLE_NAME=aide
  ansible_account: ROLE_NAME=ansible_account
  ansible_node: ROLE_NAME=ansible_node
  auditd: ROLE_NAME=auditd
  fail2ban: ROLE_NAME=fail2ban
  hosts: ROLE_NAME=hosts
  locale: ROLE_NAME=locale
  openssh_server: ROLE_NAME=openssh_server
  shadow_utils: ROLE_NAME=shadow_utils
  cron: ROLE_NAME=cron
  sudo: ROLE_NAME=sudo
  sysstat: ROLE_NAME=sysstat
  PY_COLORS={env:PY_COLORS:1}
  MOLECULE_DEBUG={env:MOLECULE_DEBUG:FALSE}
  ANSIBLE_COLLECTIONS_PATH = {toxinidir}/../../../:{toxinidir}/.ansible/collections
deps =
  molecule >= 26
  ansible-lint >= 26
  molecule-plugins[podman] >= 26
  ansible218: ansible-core==2.18.*
  ansible221: ansible-core==2.21.*
  ansible222: ansible-core==2.22.*
commands_pre =
  ansible --version
  ansible-galaxy collection install -r requirements.yml -p {toxinidir}/.ansible/collections
  ansible-galaxy collection install -r extensions/molecule/requirements.yml -p {toxinidir}/.ansible/collections
  ansible-galaxy collection list
  ansible-lint --version
commands = 
  molecule test --scenario-name {env:ROLE_NAME}

[testenv:lint]
deps =
    ansible-core==2.21.*
    ansible-lint
commands =
    ansible-lint -t deprecations {toxinidir}


[flake8]
exclude = .tox
max-line-length = 160
